services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./web-ui:/app/web-ui
      - /app/web-ui/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      - HOST=0.0.0.0